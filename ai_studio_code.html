<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Games Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <h1>Games</h1>
            <div id="game-list">
                <!-- JavaScript will inject buttons here -->
                <p>Loading games...</p>
            </div>
        </nav>

        <!-- Main Game Viewport -->
        <main class="viewport">
            <div id="welcome-msg">
                <h2>Select a game to start playing</h2>
            </div>
            <iframe id="game-frame" src="" frameborder="0" allowfullscreen></iframe>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
